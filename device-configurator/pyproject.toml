[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "config-tool"
version = "1.4.0"
description = "LoRaWAN IoT sensor provisioning utility via COM port"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "customtkinter>=5.2.0",
    "pyserial>=3.5",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
]
3d = [
    "vpython>=7.6",
]

[project.scripts]
config-tool-cli = "config_tool.cli.main:main"
config-tool-gui = "config_tool.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
