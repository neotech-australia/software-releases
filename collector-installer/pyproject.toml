[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiltmeter-platform-installer"
version = "0.1.0"
description = "Cross-platform installer and service manager for Tiltmeter Platform Docker production images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10.0",
]

[project.scripts]
tiltmeter-installer = "tiltmeter_installer.app:main"

[tool.setuptools.packages.find]
where = ["src"]
